name: Hero assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["remotion/hero-assets-request.txt"]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-pil

      - name: Build requested assets
        run: |
          set -e
          mkdir -p public/hero
          while IFS= read -r line; do
            line="${line%$'\r'}"
            [ -z "$line" ] && continue
            case "$line" in \#*) continue;; esac

            if [ "$line" = "plate" ]; then
              echo "== plate =="
              python3 - <<'PY'
          from PIL import Image
          src = Image.open("public/images/kiki-warrior-3d.png").convert("RGBA")
          bg = Image.new("RGBA", src.size, (0, 255, 0, 255))
          out = Image.alpha_composite(bg, src).convert("RGB")
          out.save("public/hero/kiki-3d-green.png")
          out.save("public/hero/kiki-3d-green.jpg", quality=92)
          print("plate:", out.size)
          PY

            elif [ "$line" = "fullplate" ]; then
              echo "== fullplate =="
              python3 - <<'PY'
          from PIL import Image
          src = Image.open("remotion/public/images/kiki.png").convert("RGBA")
          box = src.split()[3].point(lambda p: 255 if p > 10 else 0).getbbox()
          crop = src.crop(box)
          h = 1700
          w = max(1, round(crop.width * h / crop.height))
          if w > 1180:
              w = 1180
              h = max(1, round(crop.height * w / crop.width))
          kiki = crop.resize((w, h), Image.LANCZOS)
          canvas = Image.new("RGBA", (1280, 1920), (0, 0, 0, 0))
          x = (1280 - w) // 2
          y = 1920 - 110 - h
          canvas.paste(kiki, (x, y), kiki)
          canvas.save("public/hero/kiki-full.png")
          green = Image.new("RGB", (1280, 1920), (0, 255, 0))
          green.paste(canvas, (0, 0), canvas)
          green.save("public/hero/kiki-full-green.png")
          print("fullplate: crop", crop.size, "-> kiki", kiki.size, "at", (x, y))
          PY

            elif [[ "$line" == key\ * ]]; then
              url="${line#key }"
              echo "== key $url =="
              curl -L --fail "$url" -o /tmp/kiki-anim.mp4
              ffmpeg -y -i /tmp/kiki-anim.mp4 \
                -vf "chromakey=0x00FF00:0.18:0.08,despill=type=green,scale=-2:1200,format=yuva420p" \
                -c:v libvpx-vp9 -pix_fmt yuva420p -auto-alt-ref 0 -b:v 2.5M -an \
                public/hero/kiki-idle.webm
              D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/kiki-anim.mp4)
              ffmpeg -y -f lavfi -i color=c=0xF3EEE7:s=2000x2000 -i /tmp/kiki-anim.mp4 \
                -filter_complex "[1:v]chromakey=0x00FF00:0.18:0.08,despill=type=green[k];[0:v][k]scale2ref[b][k2];[b][k2]overlay=shortest=1,fps=8/$D,scale=-2:500,tile=8x1" \
                -frames:v 1 public/hero/kiki-idle-sheet.jpg
              ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 public/hero/kiki-idle.webm

            else
              echo "Unknown request line: $line"
            fi
          done < remotion/hero-assets-request.txt

      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/hero
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Hero assets"
            git push origin main
          fi
