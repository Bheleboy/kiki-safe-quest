name: Render Kiki Lessons - Talking Presenter
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "remotion/render-request.txt"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        batch: [0, 5, 10, 15, 20, 25, 30, 35, 40]
    steps:
      - uses: actions/checkout@v4
      - id: work
        name: Decide work
        run: |
          REQ=$(tr -d '\r' < remotion/render-request.txt | sed '/^\s*$/d' | sed '/^\s*#/d')
          if [ "$(echo "$REQ" | head -1 | xargs)" = "all" ]; then
            mapfile -t ALL < <(for f in remotion/src/configs/*.json; do node -e 'console.log(require(process.argv[1]).id)' "$PWD/$f"; done | sort)
            IDS=("${ALL[@]:${{ matrix.batch }}:5}")
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "ids=${IDS[*]}" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ matrix.batch }}" = "0" ]; then
              mapfile -t IDS < <(echo "$REQ" | xargs -n1)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "ids=${IDS[*]}" >> "$GITHUB_OUTPUT"
            else
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "ids=" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.work.outputs.skip == 'false'
        with:
          bun-version: latest
      - name: Install deps
        if: steps.work.outputs.skip == 'false'
        working-directory: remotion
        run: bun install
      - name: Install Chromium
        if: steps.work.outputs.skip == 'false'
        working-directory: remotion
        run: npx playwright install chromium --with-deps
      - name: Ensure ffmpeg
        if: steps.work.outputs.skip == 'false'
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Fetch talking clips
        if: steps.work.outputs.skip == 'false'
        working-directory: remotion
        timeout-minutes: 20
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: node scripts/fetch-talking-clips.mjs ${{ steps.work.outputs.ids }}
      - name: Render
        if: steps.work.outputs.skip == 'false'
        working-directory: remotion
        timeout-minutes: 60
        run: |
          mkdir -p out
          read -ra IDS <<< "${{ steps.work.outputs.ids }}"
          BROWSER=$(find "$HOME" -name "headless_shell" 2>/dev/null | head -1)
          [ -z "$BROWSER" ] && BROWSER=$(find "$HOME" -name "chrome" 2>/dev/null | head -1)
          [ -z "$BROWSER" ] && BROWSER="chromium"
          FAILED=0
          for id in "${IDS[@]}"; do
            comp="${id//_/-}"; fname="${comp//-/_}.mp4"
            echo "=== $comp ==="
            if npx remotion render "$comp" "out/$fname" --codec h264 --crf 18 --browser-executable "$BROWSER" && [ -s "out/$fname" ]; then
              echo "OK: $fname $(du -h out/$fname | cut -f1)"
            else
              echo "FAIL: $fname"; FAILED=$((FAILED+1))
            fi
          done
          cp src/talking-manifest.json out/talking-manifest.json
          [ "$FAILED" -eq 0 ]
      - uses: actions/upload-artifact@v4
        if: always() && steps.work.outputs.skip == 'false'
        with:
          name: kiki-talking-batch-${{ matrix.batch }}
          path: |
            remotion/out/*.mp4
            remotion/out/talking-manifest.json
          retention-days: 30
  release:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kiki-talking-batch-*
          merge-multiple: true
          path: mp4
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh mp4
          REQ=$(tr -d '\r' < remotion/render-request.txt | sed '/^\s*$/d' | sed '/^\s*#/d')
          if [ "$(echo "$REQ" | head -1 | xargs)" = "all" ]; then
            TAG="v2.0-talking-renders"
          else
            TAG="v2.0-talking-test"
          fi
          if ! ls mp4/*.mp4 >/dev/null 2>&1; then
            echo "ERROR: no mp4 files rendered - refusing to create an empty release"
            exit 1
          fi
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" -y --cleanup-tag || true
          FILES=(mp4/*.mp4)
          [ -f mp4/talking-manifest.json ] && FILES+=(mp4/talking-manifest.json)
          gh release create "$TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" --title "Talking presenter renders ($TAG)" --notes "Kiki lesson renders with HeyGen talking-presenter clips"
